<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with flag colors -->
  <rect width="120" height="120" fill="#078930" />
  
  <!-- Central circle with yellow -->
  <circle cx="60" cy="60" r="50" fill="#fcdd09" />
  
  <!-- Inner circle with red -->
  <circle cx="60" cy="60" r="40" fill="#da121a" />
  
  <!-- Church silhouette (white) -->
  <!-- Base -->
  <rect x="40" y="65" width="40" height="30" fill="white" />
  
  <!-- Dome base -->
  <ellipse cx="60" cy="60" rx="25" ry="12" fill="white" />
  
  <!-- Dome -->
  <ellipse cx="60" cy="48" rx="20" ry="16" fill="white" />
  <path d="M45 40 Q60 25 75 40" fill="white" />
  
  <!-- Ethiopian Cross -->
  <g transform="translate(60,42)">
    <rect x="-6" y="-15" width="12" height="30" fill="#da121a" />
    <rect x="-15" y="-6" width="30" height="12" fill="#da121a" />
    <rect x="-4" y="-10" width="8" height="20" fill="#fcdd09" />
    <rect x="-10" y="-4" width="20" height="8" fill="#fcdd09" />
    <circle cx="0" cy="-18" r="4" fill="#078930" />
    <circle cx="0" cy="18" r="4" fill="#078930" />
    <circle cx="-18" cy="0" r="4" fill="#078930" />
    <circle cx="18" cy="0" r="4" fill="#078930" />
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="6" fill="#fcdd09" />
  <circle cx="90" cy="90" r="6" fill="#fcdd09" />
  <circle cx="90" cy="30" r="4" fill="white" />
  <circle cx="30" cy="90" r="4" fill="white" />
</svg>
