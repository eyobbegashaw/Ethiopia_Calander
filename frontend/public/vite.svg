<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Pure white background -->
  <rect width="120" height="120" fill="white" />
  
  <!-- Define vertical gradient for flag colors (top-down: green, yellow, red) -->
  <defs>
    <linearGradient id="flagVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#078930" /> <!-- Green -->
      <stop offset="50%" stop-color="#fcdd09" /> <!-- Yellow -->
      <stop offset="100%" stop-color="#da121a" /> <!-- Red -->
    </linearGradient>
  </defs>
  
  <!-- Valid Ethiopian Orthodox Tewahedo Church Cross - With vertical flag colors -->
  <g transform="translate(60,60)">
    <!-- Main vertical beam -->
    <rect x="-18" y="-50" width="36" height="100" fill="url(#flagVertical)" />
    
    <!-- Main horizontal beam -->
    <rect x="-45" y="-18" width="90" height="36" fill="url(#flagVertical)" />
    
    <!-- Upper decorative crossbar -->
    <rect x="-12" y="-65" width="24" height="12" fill="url(#flagVertical)" />
    
    <!-- Lower decorative crossbar -->
    <rect x="-12" y="53" width="24" height="12" fill="url(#flagVertical)" />
    
    <!-- Left decorative end -->
    <rect x="-65" y="-12" width="12" height="24" fill="url(#flagVertical)" />
    
    <!-- Right decorative end -->
    <rect x="53" y="-12" width="12" height="24" fill="url(#flagVertical)" />
    
    <!-- Top ball -->
    <circle cx="0" cy="-73" r="7" fill="url(#flagVertical)" />
    
    <!-- Bottom ball -->
    <circle cx="0" cy="73" r="7" fill="url(#flagVertical)" />
    
    <!-- Left ball -->
    <circle cx="-73" cy="0" r="7" fill="url(#flagVertical)" />
    
    <!-- Right ball -->
    <circle cx="73" cy="0" r="7" fill="url(#flagVertical)" />
    
    <!-- Center diamond detail (white with small black center) -->
    <rect x="-6" y="-6" width="12" height="12" fill="white" transform="rotate(45)" />
    <circle cx="0" cy="0" r="5" fill="black" />
  </g>
  
   
</svg>
