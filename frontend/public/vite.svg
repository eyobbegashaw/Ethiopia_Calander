<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Pure white background -->
  <rect width="120" height="120" fill="white" />
  
  <!-- Valid Ethiopian Orthodox Tewahedo Church Cross - Perfectly fit to 120px canvas -->
  <g transform="translate(60,60)">
    <!-- Main vertical beam (fits within 120px: -18 to 18 = 36px wide, -50 to 50 = 100px tall) -->
    <rect x="-18" y="-50" width="36" height="100" fill="black" />
    
    <!-- Main horizontal beam (fits within 120px: -45 to 45 = 90px wide, -18 to 18 = 36px tall) -->
    <rect x="-45" y="-18" width="90" height="36" fill="black" />
    
    <!-- Upper decorative crossbar -->
    <rect x="-12" y="-65" width="24" height="12" fill="black" />
    
    <!-- Lower decorative crossbar -->
    <rect x="-12" y="53" width="24" height="12" fill="black" />
    
    <!-- Left decorative end -->
    <rect x="-65" y="-12" width="12" height="24" fill="black" />
    
    <!-- Right decorative end -->
    <rect x="53" y="-12" width="12" height="24" fill="black" />
    
    <!-- Top ball -->
    <circle cx="0" cy="-73" r="7" fill="black" />
    
    <!-- Bottom ball -->
    <circle cx="0" cy="73" r="7" fill="black" />
    
    <!-- Left ball -->
    <circle cx="-73" cy="0" r="7" fill="black" />
    
    <!-- Right ball -->
    <circle cx="73" cy="0" r="7" fill="black" />
    
    <!-- Center diamond detail -->
    <rect x="-6" y="-6" width="12" height="12" fill="white" transform="rotate(45)" />
    <circle cx="0" cy="0" r="5" fill="black" />
  </g>

  
  <!-- Ensure nothing extends beyond viewBox (safe boundary line - invisible) -->
  <rect width="120" height="120" fill="none" stroke="none" />
</svg>
